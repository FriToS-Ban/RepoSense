name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Unit tests (backend + eval)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # eval reads pinned commits (v1 replay, reposense corpus) with git
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: eval/requirements.txt
      - run: pip install -r eval/requirements.txt
      - name: Backend tests (rag regression, knowledge graph)
        run: python -m unittest discover -s backend/tests -t . -v
      - name: Evaluation framework tests
        run: python -m unittest discover -s eval/tests -t . -v

  eval-gate:
    name: Retrieval quality regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: tests
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: eval/requirements.txt
      - run: pip install -r eval/requirements.txt
      - name: T1 benchmark (v1 baselines S0-S4, scaling) vs committed results
        run: |
          python -m eval.run --out eval/.cache/ci-t1
          python -m eval.gate t1 eval/.cache/ci-t1/metrics.json eval/results/t1-v1-baselines/metrics.json
      - name: T1 benchmark (v2 retrieval systems) vs committed results
        run: |
          python -m eval.run_v2 --out eval/.cache/ci-t1-v2
          python -m eval.gate t1 eval/.cache/ci-t1-v2/metrics.json eval/results/t1-v2/metrics.json
      - name: Knowledge graph structure and invariants vs committed results
        run: |
          python -m eval.kg_eval stats --out eval/.cache/ci-kg-stats.json
          python -m eval.gate kg eval/.cache/ci-kg-stats.json eval/results/m1-kg/kg_stats.json
      - name: Gold-label scores and tier calibration are unchanged
        run: |
          python -m eval.kg_eval score > /dev/null
          git diff --exit-code -- backend/kg/calibration.json eval/results/m1-kg/gold_scores.json

  t2-gate:
    name: T2 history benchmark regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: eval/requirements.txt
      - run: pip install -r eval/requirements.txt
      - name: Cache the pinned T2 repositories (~80 MB of git history)
        uses: actions/cache@v4
        with:
          path: eval/.cache/t2/repos
          key: t2-repos-${{ hashFiles('eval/manifest/t2_repos.json') }}
      - name: T2 benchmark (v2 retrieval systems) vs committed results
        run: |
          python -m eval.run_t2 --out eval/.cache/ci-t2
          python -m eval.gate t1 eval/.cache/ci-t2/metrics.json eval/results/t2-v2/metrics.json
